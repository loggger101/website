name: Update Kaggle dataset stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle API
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Fetch stats via Kaggle API and write data/kaggle_stats.json
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json, datetime
          from pathlib import Path
          from kaggle.api.kaggle_api_extended import KaggleApi

          SLUGS = ["loggger/fpv-images", "loggger/star-image-bundles"]
          out_path = Path("data/kaggle_stats.json")

          # Load previous so we NEVER overwrite good values with 0 if Kaggle hiccups
          prev = {}
          if out_path.exists():
            try:
              prev = json.loads(out_path.read_text(encoding="utf-8"))
            except Exception:
              prev = {}

          api = KaggleApi()
          api.authenticate()

          out = {
            "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
            "datasets": {}
          }

          for slug in SLUGS:
            owner, ds = slug.split("/", 1)

            meta = api.metadata_get(owner, ds)  # returns dict
            info = meta.get("info", {}) if isinstance(meta, dict) else {}

            views = info.get("totalViews")
            downloads = info.get("totalDownloads")
            title = info.get("title") or slug

            prev_item = (prev.get("datasets") or {}).get(slug, {})
            if not isinstance(views, int):
              views = prev_item.get("totalViews", 0)
            if not isinstance(downloads, int):
              downloads = prev_item.get("totalDownloads", 0)

            out["datasets"][slug] = {
              "title": title,
              "totalViews": views,
              "totalDownloads": downloads,
              "sourceUrl": f"https://www.kaggle.com/datasets/{slug}"
            }

          out_path.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("Wrote", out_path, "updatedAt=", out["updatedAt"])
          PY

      - name: Commit and push (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add data/kaggle_stats.json
          git commit -m "Update Kaggle dataset stats"
          git push
