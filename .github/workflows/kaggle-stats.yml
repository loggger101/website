name: Update Kaggle dataset stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Render Kaggle pages and extract counts
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { chromium } = require("playwright");

          const SLUGS = [
            "loggger/fpv-images",
            "loggger/star-image-bundles",
          ];

          function deepFindNumber(obj, keyName) {
            // returns first numeric value found for keyName in nested objects
            const stack = [obj];
            const seen = new Set();
            while (stack.length) {
              const cur = stack.pop();
              if (!cur || typeof cur !== "object") continue;
              if (seen.has(cur)) continue;
              seen.add(cur);

              if (Object.prototype.hasOwnProperty.call(cur, keyName)) {
                const v = cur[keyName];
                if (typeof v === "number" && Number.isFinite(v)) return v;
              }

              for (const k of Object.keys(cur)) {
                const v = cur[k];
                if (v && typeof v === "object") stack.push(v);
              }
            }
            return null;
          }

          async function extractCounts(page, slug) {
            const url = `https://www.kaggle.com/datasets/${slug}`;
            await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });

            // Try Next.js payload first
            const nextData = await page.evaluate(() => window.__NEXT_DATA__ || null);
            let views = null, downloads = null, title = slug;

            if (nextData) {
              // These keys are commonly present somewhere in the payload
              views = deepFindNumber(nextData, "viewCount") ?? deepFindNumber(nextData, "totalViews");
              downloads = deepFindNumber(nextData, "downloadCount") ?? deepFindNumber(nextData, "totalDownloads");

              const t = await page.title();
              if (t) title = t.replace(" | Kaggle", "").trim();
            }

            // DOM fallback (if Kaggle changes payload)
            if (views == null || downloads == null) {
              const dom = await page.evaluate(() => document.body.innerText);
              // very loose patterns
              // If it ever includes "Views" / "Downloads" text, we can grab nearby numbers
              // (This is best-effort; payload extraction usually works)
              const mV = dom.match(/([\d,\.]+)\s+Views/i);
              const mD = dom.match(/([\d,\.]+)\s+Downloads/i);
              const parse = (s) => {
                if (!s) return null;
                const n = Number(String(s).replace(/,/g, ""));
                return Number.isFinite(n) ? n : null;
              };
              if (views == null && mV) views = parse(mV[1]);
              if (downloads == null && mD) downloads = parse(mD[1]);
            }

            return { title, views, downloads, url };
          }

          (async () => {
            const dataDir = path.join(process.cwd(), "data");
            const outPath = path.join(dataDir, "kaggle_stats.json");
            fs.mkdirSync(dataDir, { recursive: true });

            // Load previous values so we NEVER overwrite with 0 on extraction failure
            let prev = null;
            try {
              prev = JSON.parse(fs.readFileSync(outPath, "utf8"));
            } catch {}

            const browser = await chromium.launch();
            const page = await browser.newPage({
              userAgent:
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36",
            });

            const out = {
              updatedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              datasets: {},
            };

            for (const slug of SLUGS) {
              const res = await extractCounts(page, slug);

              // Keep last known good if extraction failed
              const prevItem = prev?.datasets?.[slug];
              const totalViews =
                (typeof res.views === "number" && res.views > 0) ? res.views :
                (typeof prevItem?.totalViews === "number" ? prevItem.totalViews : 0);

              const totalDownloads =
                (typeof res.downloads === "number" && res.downloads > 0) ? res.downloads :
                (typeof prevItem?.totalDownloads === "number" ? prevItem.totalDownloads : 0);

              out.datasets[slug] = {
                title: res.title || prevItem?.title || slug,
                totalViews,
                totalDownloads,
                sourceUrl: res.url
              };

              console.log(`[${slug}] views=${totalViews} downloads=${totalDownloads}`);
            }

            await browser.close();

            fs.writeFileSync(outPath, JSON.stringify(out, null, 2) + "\n", "utf8");
            console.log("Wrote", outPath);
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Commit and push (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add data/kaggle_stats.json
          git commit -m "Update Kaggle dataset stats"
          git push
