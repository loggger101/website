name: Update Kaggle dataset stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Set these in your repo:
      # Settings → Secrets and variables → Actions → New repository secret
      # - KAGGLE_USERNAME
      # - KAGGLE_KEY
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stats via Kaggle API and write data/kaggle_stats.json
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import base64
          import datetime
          import json
          import os
          import urllib.request
          import urllib.error

          SLUGS = [
              "loggger/fpv-images",
              "loggger/star-image-bundles",
          ]

          def first_present(d, keys):
              for k in keys:
                  if isinstance(d, dict) and k in d and d[k] is not None:
                      return d[k]
              return None

          def to_int(x, default=0):
              try:
                  return int(x)
              except Exception:
                  return default

          def fetch_json(url: str) -> dict:
              user = os.environ.get("KAGGLE_USERNAME")
              key = os.environ.get("KAGGLE_KEY")
              if not user or not key:
                  raise RuntimeError(
                      "Missing KAGGLE_USERNAME / KAGGLE_KEY. "
                      "Add them as GitHub Actions secrets in your repo settings."
                  )

              token = base64.b64encode(f"{user}:{key}".encode("utf-8")).decode("ascii")
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (GitHub Actions)",
                      "Accept": "application/json",
                      "Authorization": f"Basic {token}",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8")
              return json.loads(raw)

          out = {
              "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "datasets": {},
          }

          for slug in SLUGS:
              owner, ds = slug.split("/", 1)
              url = f"https://www.kaggle.com/api/v1/datasets/view/{owner}/{ds}"

              try:
                  data = fetch_json(url)
              except urllib.error.HTTPError as e:
                  body = ""
                  try:
                      body = e.read().decode("utf-8")
                  except Exception:
                      pass
                  raise RuntimeError(f"Kaggle API request failed for {slug}: HTTP {e.code} {e.reason} {body}")

              # Kaggle's response is typically {"errorMessage": ..., "info": {...}}
              info = data.get("info") if isinstance(data, dict) else None
              if not isinstance(info, dict):
                  info = data if isinstance(data, dict) else {}

              views = first_present(info, ["totalViews", "viewCount", "views"]) or 0
              downloads = first_present(info, ["totalDownloads", "downloadCount", "downloads"]) or 0
              title = first_present(info, ["title", "datasetTitle", "name"]) or slug

              out["datasets"][slug] = {
                  "title": title,
                  "totalViews": to_int(views),
                  "totalDownloads": to_int(downloads),
                  "sourceUrl": f"https://www.kaggle.com/datasets/{slug}",
              }

          with open("data/kaggle_stats.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, sort_keys=True)
              f.write("\n")

          print("Wrote data/kaggle_stats.json")
          PY

      - name: Commit and push (if changed)
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/kaggle_stats.json
          git commit -m "Update Kaggle dataset stats"
          git push
