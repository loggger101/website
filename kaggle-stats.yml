name: Update Kaggle dataset stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Kaggle stats and write data/kaggle_stats.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          fetch_ds () {
            local slug="$1"
            local owner="${slug%%/*}"
            local ds="${slug#*/}"
            local api="https://www.kaggle.com/api/v1/datasets/view/${owner}/${ds}"
            local refer="https://www.kaggle.com/datasets/${owner}/${ds}"

            # Retry a few times in case Kaggle is flaky
            curl -fsSL --retry 4 --retry-delay 2 \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (GitHub Actions)" \
              -H "Referer: ${refer}" \
              "${api}"
          }

          FPV="$(fetch_ds "loggger/fpv-images")"
          STAR="$(fetch_ds "loggger/star-image-bundles")"

          python - <<'PY'
          import json, datetime, sys

          fpv = json.loads(sys.stdin.readline())
          star = json.loads(sys.stdin.readline())

          def pick(d, keys):
              for k in keys:
                  if k in d and d[k] is not None:
                      return d[k]
              return None

          out = {
              "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "datasets": {}
          }

          def add(slug, d):
              out["datasets"][slug] = {
                  "title": pick(d, ["title", "titleNullable"]) or slug,
                  "totalViews": pick(d, ["viewCount", "totalViews", "views"]),
                  "totalDownloads": pick(d, ["downloadCount", "totalDownloads", "downloads"]),
              }

          add("loggger/fpv-images", fpv)
          add("loggger/star-image-bundles", star)

          with open("data/kaggle_stats.json","w",encoding="utf-8") as f:
              json.dump(out, f, indent=2, sort_keys=True)
              f.write("\n")
          PY <<EOF
          $FPV
          $STAR
          EOF

      - name: Commit and push (if changed)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add data/kaggle_stats.json
          git commit -m "Update Kaggle dataset stats"
          git push
