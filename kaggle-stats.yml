name: Update Kaggle dataset stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Kaggle stats and write data/kaggle_stats.json
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json
          import datetime
          import urllib.request

          SLUGS = [
              "loggger/fpv-images",
              "loggger/star-image-bundles",
          ]

          def first_present(d, keys):
              for k in keys:
                  if isinstance(d, dict) and k in d and d[k] is not None:
                      return d[k]
              return None

          def fetch_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (GitHub Actions)",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8")
              return json.loads(raw)

          out = {
              "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "datasets": {},
          }

          for slug in SLUGS:
              owner, ds = slug.split("/", 1)
              url = f"https://www.kaggle.com/api/v1/datasets/view/{owner}/{ds}"
              data = fetch_json(url)

              views = first_present(data, ["totalViews", "viewCount", "views"])
              downloads = first_present(data, ["totalDownloads", "downloadCount", "downloads"])

              out["datasets"][slug] = {
                  "title": first_present(data, ["title", "titleNullable", "datasetTitle", "name"]) or slug,
                  "totalViews": views,
                  "totalDownloads": downloads,
              }

          with open("data/kaggle_stats.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, sort_keys=True)
              f.write("\n")

          print("Wrote data/kaggle_stats.json")
          PY

      - name: Commit and push (if changed)
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/kaggle_stats.json
          git commit -m "Update Kaggle dataset stats"
          git push
